# This workflow will run tests using node and then publish a package to GitHub Packages when a release is created
# For more information see: https://docs.github.com/en/actions/publishing-packages/publishing-nodejs-packages

name: Node.js Package

on:
  release:
    types: [created]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm test

  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/
      - run: npm ci
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{secrets.npm_token}}
- name: Lightlytics Publisher
  # You may pin to the exact commit or the version.
  # uses: lightlytics/publisher@0dbe04a6743c38e602f504a4ccefd9935c243d3f
  uses: lightlytics/publisher@latest
  with:
    # Relative path to the directory of which terraform init command executed
    working-directory: 
    # Hostname of Lightlytics environment (example: env.lightlytics.com)
    ll-hostname: 
    # Relative path to Terraform plan file (JSON format)
    plan-json: # optional
    # Optional, Terraform Cloud token used to retrieve terraform plan output
    tfc-token: # optional
    # Optional, Terraform Cloud run id that was created after using terraform plan command
    tfc-run-id: # optional
    # Relative path to Terraform graph file (dot format)
    tf-graph: # optional
    # Secret token per customer used for authentication with Lightlytics (stored in GitHub)
    collection-token: 
    # GitHub token used to send a comment on Pull requests
    github-token: # optional- name: Run Parasoft Jtest
  # You may pin to the exact commit or the version.
  # uses: parasoft/run-jtest-action@b9762478080e97ba8b5cde3f9a800084c6d0fb7b
  uses: parasoft/run-jtest-action@2.0.4
  with:
    # Installation folder of Parasoft Jtest. If not specified, the cpptestcli executable must be added to PATH.
    installDir: # optional
    # Working directory for running Jtest.
    workingDir: # optional, default is ${{ github.workspace }}
    # Test configuration to be used for code analysis.
    testConfig: # optional, default is builtin://Recommended Rules
    # Output folder for reports from code analysis.
    reportDir: # optional, default is reports
    # Format of reports from code analysis.
    reportFormat: # optional, default is xml,html,sarif
    # Input scope for analysis.
    input: # optional, default is jtest.data.json
    # Additional parameters for the jtestcli executable.
    additionalParams: # optional, default is - name: Codecov ATS
  # You may pin to the exact commit or the version.
  # uses: codecov/codecov-ats@d5a8e2d68e510a4ed2d0657bb9e9e8760a3f6ffc
  uses: codecov/codecov-ats@v0.3.0
  with:
    # Repository upload token - get it from codecov.io. Required
    token: # optional
    # Repository static token - get it from codecov.io. Required
    static_token: 
    # Change the upload host (Enterprise use only)
    enterprise_url: # optional
    # File pattern to search for. Defaults to "*"
    file_pattern: # optional
    # Avoid certain folders when uploading static analysis
    folders_to_exclude: # optional
    # Force upload of files during static analysis regardless if they are new
    force: # optional
    # Max time (in seconds) to wait for the label analysis. Default is to wait forever.
    label_max_wait_time: # optional
    # Override the assumed OS. Options are linux | macos | windows.
    os: # optional
    # Variable to save down tests string. Defaults to CODECOV_ATS_TESTS
    output_variable: # optional
    # Override the assumed base commit.
    override_base_commit: # optional
    # Branch to which this commit belongs to
    override_branch: # optional
    # Commit SHA (with 40 chars)
    override_commit: # optional
    # SHA (with 40 chars) of what should be the parent of this commit
    override_parent: # optional
    # Specify the pull request number mannually.
    override_pr: # optional
    # owner/repo slug used instead of the private repo token in Self-hosted
    override_slug: # optional
    # Folders not to search during static analysis
    static_folders_to_exclude: # optional
    # Folder to search during static analysis
    static_folder_to_search: # optional
    # Force running of static analysis
    static_force: # optional
    # Number of processes to use during static analysis
    static_number_processes: # optional
    # File pattern to search for during static analysis
    static_search_pattern: # optional
    # Specify whether the Codecov output should be verbose
    verbose: # optional
    # Specify which version of the Codecov CLI should be used. Defaults to `latest`
    version: # optional- name: AccuKnox IaC
  # You may pin to the exact commit or the version.
  # uses: accuknox/iac-scan-action@0524dff6152c653cd791ae19906ed54c1311c45b
  uses: accuknox/iac-scan-action@v1.0.3
  with:
    # Directory with infrastructure code to scan
    directory: # optional, default is .
    # Specify a file for scanning; cannot be used with directory input.
    file: # optional, default is 
    # Do not display code blocks in output
    compact: # optional, default is true
    # Display only failed checks
    quiet: # optional, default is true
    # Do not return an error code if there are failed checks
    soft_fail: # optional
    # Run only on a specific infrastructure, Kubernetes or Terraform
    framework: # optional, default is 
    # CSPM panel endpoint URL
    accuknox_endpoint: 
    # Label in AccuKnox SaaS for scan results
    accuknox_label: 
    # Token for authenticating with CSPM panel
    accuknox_token: - name: Deploy GitHub Runner to AWS (EC2)
